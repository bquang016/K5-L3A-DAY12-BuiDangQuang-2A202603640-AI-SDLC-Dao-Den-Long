<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đảo Đèn Lồng — Bình Minh</title>
    <style>
      :root {
        --sky: #0e1430;
        --panel-bg: rgba(14, 20, 48, 0.84);
        --panel-border: rgba(242, 193, 78, 0.4);
        --gold: #f2c14e;
        --lantern: #ffb347;
        --danger: #ff5a5f;
        --shade-alert: #ff5a5f;
        --text-main: #f5f1e6;
        --text-muted: #c2cce3;
        --ui-scale: 1;
      }

      body.large-text {
        --ui-scale: 1.25;
      }

      body.colorblind {
        --danger: #ffffff;
        --shade-alert: #00b3ff;
      }

      body.reduced-motion .hud-flash {
        display: none !important;
      }

      body.reduced-motion .timer-value.danger {
        animation: none !important;
      }

      * {
        box-sizing: border-box;
        user-select: none;
      }

      input,
      textarea {
        user-select: text;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--sky);
        color: var(--text-main);
        font-size: calc(18px * var(--ui-scale));
        font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      }

      #app {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 14px;
        z-index: 10;
      }

      .hud-flash {
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.12s ease-out;
        z-index: 8;
      }

      .hud-reticle {
        position: fixed;
        left: 50%;
        top: 50%;
        width: 8px;
        height: 8px;
        margin-left: -4px;
        margin-top: -4px;
        border-radius: 50%;
        background: rgba(255, 233, 176, 0.72);
        box-shadow: 0 0 8px rgba(242, 193, 78, 0.85);
        pointer-events: none;
        display: none;
        z-index: 9;
      }

      .hud-top {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: flex-start;
        gap: 12px;
      }

      .hud-bottom {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: flex-end;
        gap: 12px;
      }

      .hud-panel {
        background: var(--panel-bg);
        border: 1px solid var(--panel-border);
        border-radius: 14px;
        padding: 10px 14px;
        backdrop-filter: blur(8px);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      }

      .justify-start {
        justify-self: start;
      }

      .justify-center {
        justify-self: center;
      }

      .justify-end {
        justify-self: end;
      }

      .stat-line {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 6px;
      }

      .stat-line:last-child {
        margin-bottom: 0;
      }

      .label {
        font-size: calc(18px * var(--ui-scale));
        font-weight: 600;
        color: var(--text-muted);
      }

      .flames-row {
        display: flex;
        gap: 6px;
        align-items: center;
      }

      .flame-icon {
        width: 24px;
        height: 24px;
        color: var(--lantern);
        filter: drop-shadow(0 0 6px rgba(255, 179, 71, 0.85));
        transition: opacity 0.2s;
      }

      .flame-icon.lost {
        color: #5b5f6e;
        filter: none;
        opacity: 0.35;
      }

      .charm-tag {
        margin-top: 6px;
        display: inline-block;
        padding: 4px 10px;
        border-radius: 999px;
        font-size: calc(18px * var(--ui-scale));
        font-weight: 600;
        background: rgba(200, 16, 46, 0.3);
        border: 1px solid #f2c14e;
        color: #ffe9b0;
      }

      .lock-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-top: 6px;
        padding: 4px 10px;
        border-radius: 8px;
        font-size: calc(18px * var(--ui-scale));
        background: rgba(242, 193, 78, 0.14);
        border: 1px solid rgba(242, 193, 78, 0.36);
        color: #ffe9b0;
      }

      .timer-box {
        text-align: center;
        min-width: 190px;
      }

      .timer-value {
        font-size: calc(30px * var(--ui-scale));
        font-weight: 800;
        color: var(--text-main);
        font-variant-numeric: tabular-nums;
        line-height: 1.15;
      }

      .timer-value.danger {
        color: var(--danger);
        animation: timerBlink 0.9s infinite;
      }

      @keyframes timerBlink {
        0%, 100% {
          opacity: 1;
        }
        50% {
          opacity: 0.45;
        }
      }

      .value-gold {
        font-size: calc(20px * var(--ui-scale));
        font-weight: 700;
        color: var(--gold);
        font-variant-numeric: tabular-nums;
      }

      .lantern-pips {
        display: flex;
        gap: 4px;
        align-items: center;
      }

      .lantern-svg {
        width: 18px;
        height: 22px;
        color: #5b5f6e;
      }

      .lantern-svg.lit {
        color: var(--lantern);
        filter: drop-shadow(0 0 6px rgba(255, 179, 71, 0.9));
      }

      .mote-bar-panel {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }

      .mote-title {
        font-size: calc(18px * var(--ui-scale));
        color: #ffe58a;
        font-weight: 700;
      }

      .mote-bar {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        max-width: 260px;
        gap: 5px;
        align-items: center;
      }

      .caption-stack {
        position: fixed;
        top: 108px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        max-width: min(760px, 90vw);
        pointer-events: none;
        z-index: 12;
      }

      .bottom-prompts {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        margin-bottom: 6px;
        pointer-events: none;
      }

      .alert-banner {
        padding: 6px 16px;
        border-radius: 999px;
        font-size: calc(18px * var(--ui-scale));
        font-weight: 700;
        background: rgba(14, 20, 48, 0.92);
        border: 1.5px solid var(--danger);
        color: var(--danger);
        display: none;
      }

      .shade-caption-banner {
        padding: 6px 16px;
        border-radius: 999px;
        font-size: calc(18px * var(--ui-scale));
        font-weight: 700;
        background: rgba(14, 20, 48, 0.92);
        border: 1.5px solid var(--shade-alert);
        color: #ffe9f3;
        display: none;
      }

      .countdown-banner {
        padding: 6px 18px;
        border-radius: 999px;
        font-size: calc(19px * var(--ui-scale));
        font-weight: 800;
        background: rgba(62, 16, 28, 0.92);
        border: 1.5px solid var(--gold);
        color: #ffe9b0;
        display: none;
      }

      .mote-pip {
        width: 15px;
        height: 15px;
        border-radius: 50%;
        border: 1px solid rgba(255, 229, 138, 0.45);
        background: rgba(255, 246, 194, 0.08);
      }

      .mote-pip.filled {
        background: radial-gradient(circle, #fff6c2, #ffe58a);
        border-color: #fff6c2;
        box-shadow: 0 0 8px rgba(255, 229, 138, 0.9);
      }

      .controls-hint {
        font-size: calc(18px * var(--ui-scale));
        color: var(--text-muted);
        line-height: 1.35;
        max-width: 440px;
      }

      .abilities-row {
        display: flex;
        gap: 10px;
      }

      .ability-card {
        min-width: 145px;
        text-align: center;
        padding: 8px 12px;
        border-radius: 12px;
        border: 1px solid rgba(242, 193, 78, 0.45);
        background: rgba(242, 193, 78, 0.14);
      }

      .ability-card.cooling {
        border-color: rgba(143, 163, 184, 0.3);
        background: rgba(14, 20, 48, 0.65);
        color: var(--text-muted);
      }

      .ability-title {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        font-size: calc(18px * var(--ui-scale));
        font-weight: 700;
      }

      .ability-state {
        font-size: calc(18px * var(--ui-scale));
        margin-top: 2px;
        color: var(--gold);
        font-variant-numeric: tabular-nums;
      }

      .ability-card.cooling .ability-state {
        color: var(--text-muted);
      }

      .prompt-pill {
        background: rgba(14, 20, 48, 0.92);
        border: 1px solid var(--gold);
        color: #ffe9b0;
        padding: 8px 18px;
        border-radius: 999px;
        font-size: calc(19px * var(--ui-scale));
        font-weight: 700;
        opacity: 0;
        transform: translateY(6px);
        transition: opacity 0.15s, transform 0.15s;
      }

      .prompt-pill.visible {
        opacity: 1;
        transform: translateY(0);
      }

      .lock-hint-pill {
        background: rgba(14, 20, 48, 0.88);
        border: 1px solid rgba(242, 193, 78, 0.45);
        color: #f5f1e6;
        padding: 6px 14px;
        border-radius: 999px;
        font-size: calc(18px * var(--ui-scale));
        display: none;
      }

      .whisper-banner {
        background: rgba(14, 20, 48, 0.9);
        border: 1px solid rgba(242, 193, 78, 0.4);
        color: var(--text-main);
        padding: 8px 16px;
        border-radius: 12px;
        font-size: calc(18px * var(--ui-scale));
        font-style: italic;
        max-width: 580px;
        text-align: center;
        opacity: 0;
        transition: opacity 0.3s;
      }

      .whisper-banner.visible {
        opacity: 1;
      }

      .wind-banner {
        padding: 6px 16px;
        border-radius: 999px;
        font-size: calc(18px * var(--ui-scale));
        font-weight: 700;
        background: rgba(143, 163, 184, 0.28);
        border: 1px solid #8fa3b8;
        color: #f5f1e6;
      }

      .offscreen-arrow {
        position: fixed;
        width: 38px;
        height: 38px;
        pointer-events: none;
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 15;
      }

      .offscreen-arrow svg {
        filter: drop-shadow(0 0 8px rgba(255, 179, 71, 0.9));
      }

      .offscreen-arrow.shade-arrow svg {
        filter: drop-shadow(0 0 10px var(--shade-alert));
      }

      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(14, 20, 48, 0.82);
        backdrop-filter: blur(8px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 30;
        pointer-events: auto;
      }

      .modal-backdrop.hidden {
        display: none;
      }

      .modal-card {
        width: min(680px, 94vw);
        max-height: 90vh;
        overflow-y: auto;
        background: linear-gradient(180deg, rgba(27, 35, 80, 0.97), rgba(14, 20, 48, 0.99));
        border: 1px solid rgba(242, 193, 78, 0.48);
        border-radius: 20px;
        padding: 24px 26px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65);
        text-align: center;
      }

      .modal-card h1 {
        margin: 0 0 8px;
        font-size: calc(30px * var(--ui-scale));
        color: var(--gold);
      }

      .modal-card h2 {
        margin: 0 0 10px;
        font-size: calc(24px * var(--ui-scale));
        color: var(--gold);
      }

      .modal-card p {
        margin: 0 0 14px;
        color: var(--text-main);
        opacity: 0.92;
        line-height: 1.5;
        font-size: calc(18px * var(--ui-scale));
      }

      .btn-col {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 12px;
      }

      .btn-row {
        display: flex;
        gap: 10px;
        justify-content: center;
        flex-wrap: wrap;
        margin-top: 10px;
      }

      .primary-btn {
        cursor: pointer;
        border: none;
        border-radius: 12px;
        padding: 11px 22px;
        font-size: calc(19px * var(--ui-scale));
        font-weight: 700;
        color: #120a1a;
        background: linear-gradient(135deg, #ffe9b0, #ffb347);
        box-shadow: 0 6px 20px rgba(255, 179, 71, 0.35);
      }

      .secondary-btn {
        cursor: pointer;
        border: 1px solid rgba(242, 193, 78, 0.45);
        border-radius: 12px;
        padding: 10px 18px;
        font-size: calc(18px * var(--ui-scale));
        font-weight: 600;
        color: var(--text-main);
        background: rgba(14, 20, 48, 0.72);
      }

      .primary-btn:hover,
      .secondary-btn:hover {
        filter: brightness(1.08);
      }

      .primary-btn:disabled,
      .secondary-btn:disabled {
        opacity: 0.55;
        cursor: default;
      }

      .breakdown {
        text-align: left;
        background: rgba(14, 20, 48, 0.55);
        border: 1px solid rgba(242, 193, 78, 0.25);
        border-radius: 12px;
        padding: 12px 14px;
        margin: 12px 0 14px;
        font-size: calc(18px * var(--ui-scale));
      }

      .breakdown-row {
        display: flex;
        justify-content: space-between;
        padding: 3px 0;
      }

      .breakdown-row.total {
        margin-top: 6px;
        padding-top: 8px;
        border-top: 1px solid rgba(242, 193, 78, 0.3);
        font-weight: 700;
        color: var(--gold);
        font-size: calc(19px * var(--ui-scale));
      }

      .setting-row {
        text-align: left;
        margin: 12px 0;
      }

      .setting-row label {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: calc(18px * var(--ui-scale));
        margin-bottom: 6px;
      }

      .setting-row input[type='range'] {
        width: 100%;
        accent-color: #f2c14e;
      }

      .setting-check {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 12px;
        border-radius: 10px;
        background: rgba(14, 20, 48, 0.55);
        border: 1px solid rgba(242, 193, 78, 0.25);
        margin: 10px 0;
        font-size: calc(18px * var(--ui-scale));
        cursor: pointer;
        text-align: left;
      }

      .setting-check input {
        width: 20px;
        height: 20px;
        accent-color: #f2c14e;
      }

      .keybind-section {
        margin: 14px 0;
        text-align: left;
        background: rgba(14, 20, 48, 0.55);
        border: 1px solid rgba(242, 193, 78, 0.28);
        border-radius: 12px;
        padding: 12px 14px;
      }

      .keybind-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin-bottom: 10px;
        font-size: calc(19px * var(--ui-scale));
        font-weight: 700;
        color: var(--gold);
      }

      .keybind-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 8px;
      }

      .keybind-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        font-size: calc(18px * var(--ui-scale));
        padding: 4px 6px;
        border-radius: 8px;
        background: rgba(14, 20, 48, 0.5);
      }

      .keybind-btn {
        cursor: pointer;
        min-width: 96px;
        padding: 6px 10px;
        border-radius: 8px;
        border: 1px solid rgba(242, 193, 78, 0.45);
        background: rgba(242, 193, 78, 0.14);
        color: var(--text-main);
        font-size: calc(18px * var(--ui-scale));
        font-weight: 700;
      }

      .keybind-btn.listening {
        border-color: #fff6c2;
        background: rgba(255, 179, 71, 0.38);
        color: #ffe9b0;
      }

      .keybind-btn.conflict {
        border-color: var(--danger);
        background: rgba(255, 90, 95, 0.26);
        color: #ffffff;
      }

      .conflict-warning {
        margin-top: 10px;
        padding: 8px 10px;
        border-radius: 8px;
        background: rgba(255, 90, 95, 0.2);
        border: 1px solid var(--danger);
        color: var(--danger);
        font-size: calc(18px * var(--ui-scale));
        font-weight: 600;
      }

      .score-save-box {
        text-align: left;
        background: rgba(14, 20, 48, 0.65);
        border: 1px solid rgba(242, 193, 78, 0.35);
        border-radius: 12px;
        padding: 12px 14px;
        margin: 12px 0;
        font-size: calc(18px * var(--ui-scale));
      }

      .score-save-row {
        display: flex;
        gap: 8px;
        margin-top: 8px;
        flex-wrap: wrap;
      }

      .name-input {
        flex: 1;
        min-width: 180px;
        padding: 8px 12px;
        border-radius: 10px;
        border: 1px solid rgba(242, 193, 78, 0.5);
        background: rgba(14, 20, 48, 0.9);
        color: var(--text-main);
        font-size: calc(18px * var(--ui-scale));
      }

      .form-error {
        margin-top: 8px;
        color: var(--danger);
        font-size: calc(18px * var(--ui-scale));
        font-weight: 600;
      }

      .form-success {
        margin-top: 8px;
        color: var(--gold);
        font-size: calc(18px * var(--ui-scale));
        font-weight: 700;
      }

      .leaderboard-table {
        width: 100%;
        border-collapse: collapse;
        margin: 12px 0 16px;
        font-size: calc(18px * var(--ui-scale));
        text-align: left;
      }

      .leaderboard-table th,
      .leaderboard-table td {
        padding: 8px 10px;
        border-bottom: 1px solid rgba(242, 193, 78, 0.22);
      }

      .leaderboard-table th {
        color: var(--gold);
        font-weight: 700;
      }

      .ong-dang-quote {
        background: rgba(14, 20, 48, 0.65);
        border-left: 3px solid var(--gold);
        border-radius: 8px;
        padding: 12px 14px;
        text-align: left;
        font-style: italic;
        font-size: calc(18px * var(--ui-scale));
        margin-bottom: 16px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud"></div>
    <script type="module" src="/src/game/main.js"></script>
  </body>
</html>
